version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledgerview-backend
    env_file:
      - .env
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:8000
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: ledgerview-frontend
    ports:
      - "8000:80"
    volumes:
      - ./Frontend.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped
